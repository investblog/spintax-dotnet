name: Release

# Tag-driven, and deliberately not automatic on push to main: a release is a decision, not a
# side effect of merging. Tag `v0.1.0` and this re-verifies, packs, pushes to NuGet and
# announces. The tag annotation IS the release note (see RELEASING.md).
#
# Publishing is keyless: NuGet Trusted Publishing exchanges this job's GitHub OIDC token for a
# one-hour API key against the policy registered on nuget.org (owner investblog, repository
# spintax-dotnet, workflow release.yml, environment nuget). No long-lived key is stored anywhere.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # the GitHub release
  id-token: write   # the OIDC token NuGet exchanges for a temporary API key

jobs:
  # A tag can be placed on any commit, including one CI never saw green: the gate re-runs here
  # so the artifact that reaches NuGet is one that passed, not one that probably did.
  verify-and-publish:
    runs-on: windows-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the annotated tag object is the release note

      - name: Check out the golden corpus
        uses: actions/checkout@v7
        with:
          repository: investblog/spintax-js
          path: .corpus

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Spintax.sln -c Release -nologo -v q

      - name: Format
        run: dotnet format Spintax.sln --verify-no-changes -v q

      - name: Unit tests
        run: dotnet test Spintax.sln -c Release --no-build -nologo -v q

      - name: Golden corpus, net8.0
        env:
          SPINTAX_FIXTURES: ${{ github.workspace }}\.corpus\packages\conformance\fixtures
        run: dotnet run --project tests/Spintax.Corpus -c Release -f net8.0 --no-build -- --baseline tests/known-failures.txt

      - name: Golden corpus, net472
        env:
          SPINTAX_FIXTURES: ${{ github.workspace }}\.corpus\packages\conformance\fixtures
        run: dotnet run --project tests/Spintax.Corpus -c Release -f net472 --no-build -- --baseline tests/known-failures.txt

      # The package version must be the tag: a mismatched bump stops before upload.
      # Both checks run BEFORE pack and push: a NuGet version is irreversible, so a lightweight
      # tag or a mismatched bump must stop here, not after the upload.
      - name: Annotated tag, version == tag
        shell: pwsh
        run: |
          git fetch --force --tags origin
          if ((git cat-file -t "${{ github.ref_name }}") -ne "tag") { throw "${{ github.ref_name }} is a lightweight tag; releases need an annotated one (RELEASING.md)" }
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $ver = ([xml](Get-Content src/Spintax.Core/Spintax.Core.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($ver -ne $tag) { throw "csproj Version $ver does not match tag $tag" }

      - name: Pack
        run: dotnet pack src/Spintax.Core -c Release --no-build -o artifacts

      # Requested right before the push: the temporary key lives one hour, one token per key.
      # NUGET_USER is the nuget.org profile name (not an e-mail) — an environment VARIABLE, not a
      # secret: it is public on nuget.org anyway, and a secret would mask the word in every log line.
      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      # pwsh does not expand the glob for dotnet; the .nupkg is named, and NuGet pushes the
      # matching .snupkg from the same folder on its own.
      - name: Push to NuGet
        shell: pwsh
        run: |
          $pkg = (Get-ChildItem artifacts/*.nupkg | Select-Object -First 1).FullName
          dotnet nuget push $pkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      # Announced only after NuGet accepted the upload: a release never names an artifact that
      # was not published. The annotated tag's message is the release body.
      # The tag must be annotated (RELEASING.md): its subject is the title, its body the notes,
      # passed through a file so that line breaks survive.
      - name: GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $subject = (git for-each-ref "refs/tags/$tag" --format='%(contents:subject)') -join ''
          git for-each-ref "refs/tags/$tag" --format='%(contents:body)' | Out-File -FilePath notes.md -Encoding utf8
          if ((Get-Content notes.md -Raw).Trim().Length -eq 0) { "Spintax.Core $tag" | Out-File -FilePath notes.md -Encoding utf8 }
          gh release create $tag (Get-ChildItem artifacts/*.nupkg) --title "$subject" --notes-file notes.md
