# Merge into ./.codex/config.toml. apply_patch is codex's edit tool; check.sh parses the
# patch for changed files. Adjust the matcher to your codex version's tool names if needed.
[[hooks.PostToolUse]]
matcher = "apply_patch"

[[hooks.PostToolUse.hooks]]
type = "command"
command = 'bash ".agents/hooks/docs-frontmatter/check.sh"'
statusMessage = "docs-frontmatter"
